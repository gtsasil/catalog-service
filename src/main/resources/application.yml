spring:
  application:
    name: catalog-service

  datasource:
    url: jdbc:postgresql://localhost:16432/catalog_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
